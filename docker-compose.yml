services:
  # =======  DATABASE ======= #
  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ecommerce_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: ${DB_PORT:-3306}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - ecommerce_net

  # =======  CACHE ======= #
  redis:
    image: redis:7.4-alpine
    container_name: ecommerce_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 15s
      retries: 3
    networks:
      - ecommerce_net

  # =======  BACKEND ======= #
  backend:
    build: ./backend
    container_name: ecommerce_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_ADMIN_URL}
      - MYSQL_DATABASE_TEST=${MYSQL_DATABASE_TEST}
      - MYSQL_USER_TEST=${MYSQL_USER_TEST}
      - MYSQL_PASSWORD_TEST=${MYSQL_PASSWORD_TEST}
      - MYSQL_HOST_TEST=${MYSQL_HOST_TEST}
      - MYSQL_PORT_TEST=${MYSQL_PORT_TEST}
      - PEXELS_API_KEY_TEST=${PEXELS_API_KEY_TEST}
    ports:
      - "${PORT}:${PORT}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    networks:
      - ecommerce_net
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9100"

  # =======  FRONTENDS ======= #
  frontend-store:
    build: ./frontend-store
    container_name: ecommerce_frontend_store
    restart: always
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_STORE_API_URL}
      - VITE_APP_NAME=${VITE_STORE_APP_NAME}
      - VITE_NODE_ENV=${NODE_ENV}
      - VITE_PORT=${VITE_STORE_PORT}
      - VITE_JWT_SECRET=${VITE_JWT_SECRET}
      - VITE_REFRESH_TOKEN_COOKIE_NAME=${VITE_REFRESH_TOKEN_COOKIE_NAME}
      - VITE_CACHE_TIME=${VITE_CACHE_TIME}
    ports:
      - "${VITE_STORE_PORT}:3000"
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    networks:
      - ecommerce_net

  frontend-admin:
    build: ./frontend-admin
    container_name: ecommerce_frontend_admin
    restart: always
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_ADMIN_API_URL}
      - VITE_APP_NAME=${VITE_ADMIN_APP_NAME}
      - VITE_NODE_ENV=${NODE_ENV}
      - VITE_PORT=${VITE_ADMIN_PORT}
      - VITE_JWT_SECRET=${VITE_JWT_SECRET}
      - VITE_REFRESH_TOKEN_COOKIE_NAME=${VITE_REFRESH_TOKEN_COOKIE_NAME}
      - VITE_CACHE_TIME=${VITE_CACHE_TIME}
    ports:
      - "${VITE_ADMIN_PORT}:3000"
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    networks:
      - ecommerce_net

  # =======  MONITORING STACK ======= #
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-32090}:9090"
    networks:
      - ecommerce_net
      - monitoring

  node_exporter:
    image: prom/node-exporter:latest
    container_name: ecommerce_node_exporter
    restart: always
    pid: "host"
    network_mode: host
    ports:
    - "${NODEEXPORTER_PORT:-32100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--web.listen-address=:9100'
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ecommerce_cadvisor
    restart: always
    ports:
      - "${CADVISOR_PORT:-32081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - monitoring

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./monitoring/mysqld_exporter.cnf:/etc/mysql/my.cnf:ro
    command:
      - "--config.my-cnf=/etc/mysql/my.cnf"
      - "--collect.global_status"
      - "--collect.global_variables"
      - "--collect.engine_innodb_status"
      - "--collect.info_schema.tables"
      - "--collect.info_schema.processlist"
      - "--collect.info_schema.query_response_time"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9104/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "32104:9104"
    networks:
      - ecommerce_net
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "${REDISEXPORTER_PORT:-32121}:9121"
    depends_on:
      - redis
    networks:
      - ecommerce_net
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "${GRAFANA_PORT:-32300}:3000"
    depends_on:
      - prometheus
    networks:
      - ecommerce_net
      - monitoring
    
  
# =======  VOLUMES ======= #
volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:


# =======  NETWORKS ======= #
networks:
  ecommerce_net:
    driver: bridge
  monitoring:
    driver: bridge
